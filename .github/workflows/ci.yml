name: CI - Frontend Quality Checks

on:
  push:
    branches-ignore: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-typecheck:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build Dry-Run
        run: npm run build

      - name: Create Pull Request to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            echo "Nenhum PR encontrado. Criando novo Pull Request..."
            gh pr create               --title "Auto PR: merge $BRANCH_NAME into main"               --body "Pull Request criado automaticamente pela pipeline de CI do Frontend após validações de TypeScript, ESLint e Build com sucesso!"               --base main               --head "$BRANCH_NAME"
          else
            echo "Já existe um Pull Request aberto para esta branch: PR #$EXISTING_PR"
          fi
